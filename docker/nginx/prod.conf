server {
    listen 80;
    server_name _;
    charset utf-8;

    client_max_body_size 20m;

    # Laravel API (Bearer-token auth, no cookies/CORS needed — same origin).
    # ^~ stops nginx's regex search so these always win over the SPA "/"
    # fallback below, regardless of location declaration order.
    location ^~ /api/ {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location ^~ /sanctum/ {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    # Top-level (not nested) so it's reachable after the internal redirect
    # try_files above performs to /index.php.
    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Vue SPA
    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
