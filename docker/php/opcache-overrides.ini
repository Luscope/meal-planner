; Every request in a fresh opcache validation cycle stat()s the full framework
; +app file set to check for changes. Over the Docker Desktop Windows bind
; mount that stat() pass is slow (seconds, not milliseconds), and real usage
; (minutes between page loads while reading a recipe) exceeds any reasonable
; revalidate_freq window, so the slow path still gets hit regularly.
; Disabling timestamp validation entirely removes that overhead for good, at
; the cost of needing to restart the app/queue containers after backend PHP
; changes for them to take effect (the same tradeoff production deployments
; make; `docker compose restart app queue` after editing backend code).
opcache.validate_timestamps=0
